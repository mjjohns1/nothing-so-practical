<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap');

  :root {
    --blue-causal: #2563EB;
    --blue-causal-light: rgba(37, 99, 235, 0.15);
    --red-confound: #DC2626;
    --red-confound-light: rgba(220, 38, 38, 0.12);
    --gray-severed: #CBD5E1;
    --green-front: #059669;
    --green-front-light: rgba(5, 150, 105, 0.12);
    --amber-front: #D97706;
    --amber-front-light: rgba(217, 119, 6, 0.12);
    --node-fill: #FFFFFF;
    --node-stroke: #334155;
    --node-unobserved-fill: #F8FAFC;
    --node-unobserved-stroke: #94A3B8;
    --text-primary: #1E293B;
    --text-secondary: #64748B;
    --bg-panel: #FFFFFF;
    --bg-container: #F8FAFC;
    --border-light: #E2E8F0;
    --font-serif: 'Source Serif 4', Georgia, serif;
    --font-sans: 'Source Sans 3', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  .do-calc-container {
    max-width: 780px;
    margin: 2rem auto;
    font-family: var(--font-sans);
    color: var(--text-primary);
  }

  /* Mode Toggle */
  .mode-controls {
    display: flex;
    gap: 0;
    margin-bottom: 1.5rem;
    border: 1px solid var(--border-light);
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg-panel);
  }

  .mode-btn {
    flex: 1;
    padding: 0.7rem 1rem;
    border: none;
    background: transparent;
    font-family: var(--font-sans);
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    letter-spacing: 0.01em;
  }

  .mode-btn:not(:last-child) {
    border-right: 1px solid var(--border-light);
  }

  .mode-btn:hover {
    background: var(--bg-container);
    color: var(--text-primary);
  }

  .mode-btn.active {
    color: var(--text-primary);
    font-weight: 600;
  }

  .mode-btn.active.observe { background: var(--red-confound-light); }
  .mode-btn.active.do-mode { background: var(--blue-causal-light); }
  .mode-btn.active.frontdoor { background: var(--green-front-light); }

  .mode-btn code {
    font-family: var(--font-mono);
    font-size: 0.82rem;
    background: rgba(0,0,0,0.06);
    padding: 0.1em 0.35em;
    border-radius: 3px;
  }

  /* DAG SVG */
  .dag-wrapper {
    background: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 1.5rem 1rem 1rem;
    margin-bottom: 1rem;
  }

  .dag-svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .dag-svg text {
    font-family: var(--font-sans);
    user-select: none;
  }

  .dag-svg .node-label {
    font-size: 13.5px;
    font-weight: 600;
    fill: var(--text-primary);
  }

  .dag-svg .node-sublabel {
    font-size: 10.5px;
    fill: var(--text-secondary);
    font-style: italic;
  }

  .dag-svg .node-circle {
    stroke-width: 2;
    transition: fill 0.4s ease, stroke 0.4s ease, stroke-width 0.3s ease;
  }

  .dag-svg .edge-line {
    fill: none;
    stroke-width: 2.2;
    transition: stroke 0.5s ease, stroke-dasharray 0.5s ease, opacity 0.5s ease;
  }

  .dag-svg .edge-arrow {
    transition: fill 0.5s ease, opacity 0.5s ease;
  }

  .dag-svg .particle {
    opacity: 0;
  }

  /* Info Panel */
  .info-panel {
    display: flex;
    gap: 1rem;
    align-items: stretch;
  }

  .description-box {
    flex: 1;
    background: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 1.1rem 1.3rem;
    min-height: 90px;
    display: flex;
    align-items: center;
  }

  .description-text {
    font-family: var(--font-serif);
    font-size: 0.95rem;
    line-height: 1.55;
    color: var(--text-primary);
  }

  .description-text em {
    font-style: italic;
    color: var(--text-secondary);
  }

  .estimate-box {
    width: 200px;
    min-width: 200px;
    background: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 1rem 1.2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    transition: border-color 0.4s ease;
  }

  .estimate-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
    margin-bottom: 0.4rem;
    font-weight: 600;
  }

  .estimate-value {
    font-family: var(--font-mono);
    font-size: 1.8rem;
    font-weight: 600;
    line-height: 1.1;
    transition: color 0.4s ease;
  }

  .estimate-sub {
    font-size: 0.72rem;
    color: var(--text-secondary);
    margin-top: 0.35rem;
    font-family: var(--font-mono);
  }

  .estimate-box.observe { border-color: var(--red-confound); }
  .estimate-box.observe .estimate-value { color: var(--red-confound); }
  .estimate-box.do-mode { border-color: var(--blue-causal); }
  .estimate-box.do-mode .estimate-value { color: var(--blue-causal); }
  .estimate-box.frontdoor { border-color: var(--green-front); }
  .estimate-box.frontdoor .estimate-value { color: var(--green-front); }

  /* Severed edge animation */
  @keyframes dash-flow {
    to { stroke-dashoffset: -16; }
  }
  .edge-severed {
    stroke-dasharray: 8 8 !important;
    animation: dash-flow 1s linear infinite;
  }

  /* Legend */
  .legend {
    display: flex;
    gap: 1.2rem;
    justify-content: center;
    margin-top: 0.5rem;
    padding-bottom: 0.3rem;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.75rem;
    color: var(--text-secondary);
  }

  .legend-swatch {
    width: 24px;
    height: 3px;
    border-radius: 2px;
  }

  .legend-swatch.causal { background: var(--blue-causal); }
  .legend-swatch.confound { background: var(--red-confound); }
  .legend-swatch.severed {
    background: repeating-linear-gradient(
      90deg,
      var(--gray-severed) 0 6px,
      transparent 6px 12px
    );
  }
  .legend-swatch.front-a { background: var(--green-front); }
  .legend-swatch.front-b { background: var(--amber-front); }

  /* Simulation Controls */
  .sim-controls {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }

  .sim-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: 1px solid var(--border-light);
    border-radius: 8px;
    background: var(--bg-panel);
    cursor: pointer;
    color: var(--text-secondary);
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .sim-btn:hover {
    background: var(--bg-container);
    color: var(--text-primary);
    border-color: #CBD5E1;
  }

  .sim-btn svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  .progress-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .progress-track {
    flex: 1;
    height: 4px;
    background: var(--border-light);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    background: var(--text-secondary);
    transition: width 0.15s ease, background 0.4s ease;
  }

  .progress-fill.observe { background: var(--red-confound); }
  .progress-fill.do-mode { background: var(--blue-causal); }
  .progress-fill.frontdoor { background: var(--green-front); }

  .progress-label {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-secondary);
    white-space: nowrap;
    min-width: 110px;
    text-align: right;
  }

  .sim-complete-tag {
    font-family: var(--font-sans);
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 0.15em 0.5em;
    border-radius: 4px;
    background: var(--bg-container);
    color: var(--text-secondary);
    border: 1px solid var(--border-light);
    display: none;
  }

  .sim-complete-tag.visible { display: inline-block; }

  @media (max-width: 600px) {
    .info-panel { flex-direction: column; }
    .estimate-box { width: 100%; min-width: unset; }
    .mode-btn { font-size: 0.8rem; padding: 0.6rem 0.5rem; }
  }
</style>

        </marker>
        <marker id="arrow-confound" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6" fill="var(--red-confound)" class="edge-arrow" />

        <marker id="arrow-severed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">

        <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">

      <!-- Severed X marks (hidden by default) -->

        <g transform="translate(480, 260)">
          <rect x="-30" y="-10" width="60" height="20" rx="4" fill="var(--amber-front)" opacity="0.9" />

    <div class="legend" id="legend">

  <div class="sim-controls">

    </button>
    <button class="sim-btn" id="reset-btn" onclick="resetAndRestart()" title="Reset simulation">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0012 4a8 8 0 108 8h-2a6 6 0 11-1.76-4.24L14 10h7V3l-3.35 3.35z"/></svg>

      <div class="estimate-label">Estimated Effect</div>

</div>

<script>
(function() {
  // ─── Configuration ───
  const TRUE_EFFECT = 55;
  const MAX_N = 10487;
  const SIM_SPEED = 16; // ms between simulated students (batched)
  const BATCH_SIZE = 20;
  const PARTICLE_SPEED = 0.012;
  const SPAWN_RATE = 0.035; // probability of spawning per frame per edge

  // ─── State ───
  let currentMode = 'observe';
  let simInterval = null;
  let animFrame = null;
  let particles = [];
  let isRunning = true;
  let isComplete = false;
  let simData = { prep: [], nprep: [], n: 0, estimate: null };
  // Front-door accumulators
  let fdData = {
    // Step 1: effect of prep on hours
    prepHours: [], nprepHours: [],
    // Step 2: within prep groups, hours->SAT
    prep1: [], prep0: [],
    n: 0, estimate: null
  };

  // ─── Edge definitions ───
  const edges = {
    'mot-prep':    { from: [305,72],  to: [195,168], type: 'confound', cp: [[260,100],[210,130]] },
    'mot-sat':     { from: [415,72],  to: [565,168], type: 'confound', cp: [[460,100],[530,130]] },
    'prep-hours':  { from: [222,200], to: [318,200], type: 'causal',   cp: null },
    'hours-sat':   { from: [432,200], to: [528,200], type: 'causal',   cp: null },
  };

  // Bezier or linear interpolation along edge
  function getPointOnEdge(edgeId, t) {
    const e = edges[edgeId];
    if (!e.cp) {
      // Linear
      return {
        x: e.from[0] + (e.to[0] - e.from[0]) * t,
        y: e.from[1] + (e.to[1] - e.from[1]) * t
      };
    }
    // Cubic bezier: from, cp1, cp2, to
    const p0 = e.from, p1 = e.cp[0], p2 = e.cp[1], p3 = e.to;
    const u = 1 - t;
    return {
      x: u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0],
      y: u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1]
    };
  }

  // ─── DGP ───
  function randn() {
    let u = 0, v = 0;
    while(u === 0) u = Math.random();
    while(v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  function sigmoid(x) { return 1 / (1 + Math.exp(-x)); }

  function generateStudent(forcePrep) {
    const motivation = randn();
    let prep;
    if (forcePrep !== undefined) {
      prep = forcePrep;
    } else {
      prep = Math.random() < sigmoid(1.1 * motivation) ? 1 : 0;
    }
    const hours = 10 + 11 * prep + randn() * 3;
    const sat = 800 + 5 * hours + 90 * motivation + randn() * 30;
    return { motivation, prep, hours, sat };
  }

  // ─── Simulation ───
  function resetSim() {
    simData = { prep: [], nprep: [], n: 0, estimate: null };
    fdData = { prepHours: [], nprepHours: [], prep1: [], prep0: [], n: 0, estimate: null };
    isComplete = false;
    updateEstimateDisplay(null, 0);
    updateProgress(0);
    document.getElementById('complete-tag').classList.remove('visible');
  }

  function getCurrentN() {
    return currentMode === 'frontdoor' ? fdData.n : simData.n;
  }

  function runSimBatch() {
    if (isComplete) return;

    const remaining = MAX_N - getCurrentN();
    if (remaining <= 0) {
      completeSimulation();
      return;
    }
    const batchSize = Math.min(BATCH_SIZE, remaining);

    for (let i = 0; i < batchSize; i++) {
      if (currentMode === 'observe') {
        const s = generateStudent();
        if (s.prep === 1) simData.prep.push(s.sat);
        else simData.nprep.push(s.sat);
        simData.n++;
      } else if (currentMode === 'do') {
        // Randomized: force prep to 0 or 1 with equal probability
        const forced = Math.random() < 0.5 ? 1 : 0;
        const s = generateStudent(forced);
        if (s.prep === 1) simData.prep.push(s.sat);
        else simData.nprep.push(s.sat);
        simData.n++;
      } else if (currentMode === 'frontdoor') {
        const s = generateStudent(); // observational data
        if (s.prep === 1) {
          fdData.prepHours.push(s.hours);
          fdData.prep1.push({ hours: s.hours, sat: s.sat });
        } else {
          fdData.nprepHours.push(s.hours);
          fdData.prep0.push({ hours: s.hours, sat: s.sat });
        }
        fdData.n++;
      }
    }

    let est = null;
    let n = 0;

    if (currentMode === 'observe' || currentMode === 'do') {
      n = simData.n;
      if (simData.prep.length > 10 && simData.nprep.length > 10) {
        const meanPrep = simData.prep.reduce((a,b) => a+b, 0) / simData.prep.length;
        const meanNPrep = simData.nprep.reduce((a,b) => a+b, 0) / simData.nprep.length;
        est = meanPrep - meanNPrep;
      }
    } else {
      n = fdData.n;
      if (fdData.prepHours.length > 30 && fdData.nprepHours.length > 30) {
        // Step 1: E[hours|prep=1] - E[hours|prep=0]
        const meanH1 = fdData.prepHours.reduce((a,b)=>a+b,0) / fdData.prepHours.length;
        const meanH0 = fdData.nprepHours.reduce((a,b)=>a+b,0) / fdData.nprepHours.length;
        const alpha = meanH1 - meanH0;

        // Step 2: simple pooled regression of SAT on Hours controlling for Prep
        // Using OLS on combined data
        const all = [...fdData.prep1.map(d => ({...d, prep:1})),
                     ...fdData.prep0.map(d => ({...d, prep:0}))];
        if (all.length > 50) {
          // Partial regression: regress SAT on Hours + Prep
          const n2 = all.length;
          let sH = 0, sP = 0, sY = 0, sHH = 0, sPP = 0, sHP = 0, sHY = 0, sPY = 0;
          for (const d of all) {
            sH += d.hours; sP += d.prep; sY += d.sat;
            sHH += d.hours*d.hours; sPP += d.prep*d.prep; sHP += d.hours*d.prep;
            sHY += d.hours*d.sat; sPY += d.prep*d.sat;
          }
          // OLS for Y = b0 + b1*H + b2*P
          const mH = sH/n2, mP = sP/n2, mY = sY/n2;
          // Centered sums
          let cHH=0, cPP=0, cHP=0, cHY=0, cPY=0;
          for (const d of all) {
            const dh = d.hours - mH, dp = d.prep - mP, dy = d.sat - mY;
            cHH += dh*dh; cPP += dp*dp; cHP += dh*dp; cHY += dh*dy; cPY += dp*dy;
          }
          const det = cHH*cPP - cHP*cHP;
          if (Math.abs(det) > 0.001) {
            const beta = (cPP*cHY - cHP*cPY) / det; // coefficient on Hours
            est = alpha * beta;
          }
        }
      }
    }

    updateEstimateDisplay(est, n);
    updateProgress(n);

    if (n >= MAX_N) {
      completeSimulation();
    }
  }

  function updateProgress(n) {
    const pct = Math.min(100, (n / MAX_N) * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-label').textContent =
      n.toLocaleString() + ' / ' + MAX_N.toLocaleString();
  }

  let loopTimeout = null;

  function completeSimulation() {
    isComplete = true;
    if (simInterval) { clearInterval(simInterval); simInterval = null; }
    document.getElementById('complete-tag').classList.add('visible');

    // Hold the final estimate for 2s, then loop
    if (isRunning) {
      loopTimeout = setTimeout(() => {
        if (!isRunning) return; // user paused during hold
        resetSim();
        isComplete = false;
        simInterval = setInterval(runSimBatch, SIM_SPEED);
      }, 2000);
    }
  }

  function togglePlayPause() {
    if (isRunning) {
      // Pause
      isRunning = false;
      if (simInterval) { clearInterval(simInterval); simInterval = null; }
      if (loopTimeout) { clearTimeout(loopTimeout); loopTimeout = null; }
      document.getElementById('pause-icon').style.display = 'none';
      document.getElementById('play-icon').style.display = 'block';
    } else {
      // Resume
      isRunning = true;
      document.getElementById('pause-icon').style.display = 'block';
      document.getElementById('play-icon').style.display = 'none';
      if (isComplete) {
        // Was paused while complete — restart the loop
        resetSim();
        isComplete = false;
      }
      simInterval = setInterval(runSimBatch, SIM_SPEED);
    }
  }

  function resetAndRestart() {
    if (simInterval) { clearInterval(simInterval); simInterval = null; }
    if (loopTimeout) { clearTimeout(loopTimeout); loopTimeout = null; }
    // Clear particles
    particles.forEach(p => p.el.remove());
    particles = [];
    resetSim();
    isRunning = true;
    document.getElementById('pause-icon').style.display = 'block';
    document.getElementById('play-icon').style.display = 'none';
    simInterval = setInterval(runSimBatch, SIM_SPEED);
  }

  // Expose to onclick handlers
  window.togglePlayPause = togglePlayPause;
  window.resetAndRestart = resetAndRestart;

  function updateEstimateDisplay(est, n) {
    const valEl = document.getElementById('estimate-value');
    if (est === null) {
      valEl.textContent = '—';
    } else {
      valEl.textContent = '+' + Math.round(est) + ' pts';
    }
  }

  // ─── Particle Animation ───
  function getActiveEdges() {
    if (currentMode === 'observe') {
      return ['mot-prep', 'mot-sat', 'prep-hours', 'hours-sat'];
    } else if (currentMode === 'do') {
      return ['mot-sat', 'prep-hours', 'hours-sat'];
    } else {
      return ['mot-prep', 'mot-sat', 'prep-hours', 'hours-sat'];
    }
  }

  function getParticleColor(edgeId) {
    if (currentMode === 'frontdoor') {
      if (edgeId === 'prep-hours') return 'var(--green-front)';
      if (edgeId === 'hours-sat') return 'var(--amber-front)';
      if (edgeId === 'mot-prep' || edgeId === 'mot-sat') return 'var(--gray-severed)';
    }
    const e = edges[edgeId];
    return e.type === 'confound' ? 'var(--red-confound)' : 'var(--blue-causal)';
  }

  function getParticleOpacity(edgeId) {
    if (currentMode === 'frontdoor' && (edgeId === 'mot-prep' || edgeId === 'mot-sat')) {
      return 0.3;
    }
    return 0.85;
  }

  const particleGroup = document.getElementById('particles');

  function spawnParticle(edgeId) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    el.setAttribute('r', '3.5');
    el.setAttribute('fill', getParticleColor(edgeId));
    el.setAttribute('opacity', '0');
    particleGroup.appendChild(el);
    particles.push({ el, edgeId, t: 0, alive: true });
  }

  function animateParticles() {
    const active = getActiveEdges();

    // Spawn new particles only when running
    if (isRunning && !isComplete) {
      for (const eid of active) {
        if (Math.random() < SPAWN_RATE) {
          spawnParticle(eid);
        }
      }
    }

    // Update
    for (const p of particles) {
      p.t += PARTICLE_SPEED + Math.random() * 0.003;
      if (p.t >= 1) {
        p.alive = false;
        p.el.remove();
        continue;
      }
      const pos = getPointOnEdge(p.edgeId, p.t);
      p.el.setAttribute('cx', pos.x);
      p.el.setAttribute('cy', pos.y);

      // Fade in/out
      const fadeIn = Math.min(1, p.t / 0.15);
      const fadeOut = Math.min(1, (1 - p.t) / 0.15);
      const baseOpacity = getParticleOpacity(p.edgeId);
      p.el.setAttribute('opacity', (fadeIn * fadeOut * baseOpacity).toFixed(2));
      p.el.setAttribute('fill', getParticleColor(p.edgeId));
    }

    particles = particles.filter(p => p.alive);
    animFrame = requestAnimationFrame(animateParticles);
  }

  // ─── Edge Styling ───
  function updateEdges() {
    const motPrep = document.getElementById('edge-mot-prep');
    const motSat = document.getElementById('edge-mot-sat');
    const prepHours = document.getElementById('edge-prep-hours');
    const hoursSat = document.getElementById('edge-hours-sat');
    const severMarks = document.getElementById('sever-marks');
    const fdLabels = document.getElementById('frontdoor-labels');
    const legend = document.getElementById('legend');
    const prepNode = document.querySelector('#node-prep circle');

    // Reset
    motPrep.classList.remove('edge-severed');
    severMarks.style.transition = 'opacity 0.4s ease';
    fdLabels.style.transition = 'opacity 0.4s ease';

    if (currentMode === 'observe') {
      motPrep.setAttribute('stroke', 'var(--red-confound)');
      motPrep.setAttribute('marker-end', 'url(#arrow-confound)');
      motPrep.style.opacity = 1;
      motSat.setAttribute('stroke', 'var(--red-confound)');
      motSat.setAttribute('marker-end', 'url(#arrow-confound)');
      prepHours.setAttribute('stroke', 'var(--blue-causal)');
      prepHours.setAttribute('marker-end', 'url(#arrow-causal)');
      hoursSat.setAttribute('stroke', 'var(--blue-causal)');
      hoursSat.setAttribute('marker-end', 'url(#arrow-causal)');
      severMarks.style.opacity = 0;
      fdLabels.style.opacity = 0;
      prepNode.setAttribute('stroke', 'var(--node-stroke)');
      prepNode.setAttribute('stroke-width', '2');
      prepNode.setAttribute('fill', 'var(--node-fill)');
      legend.innerHTML = `
        <div class="legend-item"><div class="legend-swatch causal"></div>Causal path</div>
        <div class="legend-item"><div class="legend-swatch confound"></div>Confounding path</div>
      `;
    } else if (currentMode === 'do') {
      motPrep.setAttribute('stroke', 'var(--gray-severed)');
      motPrep.setAttribute('marker-end', 'url(#arrow-severed)');
      motPrep.classList.add('edge-severed');
      motPrep.style.opacity = 0.5;
      motSat.setAttribute('stroke', 'var(--red-confound)');
      motSat.setAttribute('marker-end', 'url(#arrow-confound)');
      prepHours.setAttribute('stroke', 'var(--blue-causal)');
      prepHours.setAttribute('marker-end', 'url(#arrow-causal)');
      hoursSat.setAttribute('stroke', 'var(--blue-causal)');
      hoursSat.setAttribute('marker-end', 'url(#arrow-causal)');
      severMarks.style.opacity = 1;
      fdLabels.style.opacity = 0;
      prepNode.setAttribute('stroke', 'var(--blue-causal)');
      prepNode.setAttribute('stroke-width', '3');
      prepNode.setAttribute('fill', 'var(--blue-causal-light)');
      legend.innerHTML = `
        <div class="legend-item"><div class="legend-swatch causal"></div>Causal path</div>
        <div class="legend-item"><div class="legend-swatch severed"></div>Severed by intervention</div>
      `;
    } else if (currentMode === 'frontdoor') {
      motPrep.setAttribute('stroke', 'var(--gray-severed)');
      motPrep.setAttribute('marker-end', 'url(#arrow-severed)');
      motPrep.style.opacity = 0.4;
      motSat.setAttribute('stroke', 'var(--gray-severed)');
      motSat.setAttribute('marker-end', 'url(#arrow-severed)');
      motSat.style.opacity = 0.4;
      prepHours.setAttribute('stroke', 'var(--green-front)');
      prepHours.setAttribute('marker-end', 'url(#arrow-green)');
      hoursSat.setAttribute('stroke', 'var(--amber-front)');
      hoursSat.setAttribute('marker-end', 'url(#arrow-amber)');
      severMarks.style.opacity = 0;
      fdLabels.style.opacity = 1;
      prepNode.setAttribute('stroke', 'var(--node-stroke)');
      prepNode.setAttribute('stroke-width', '2');
      prepNode.setAttribute('fill', 'var(--node-fill)');
      legend.innerHTML = `
        <div class="legend-item"><div class="legend-swatch front-a"></div>Step 1: Prep → Hours (clean)</div>
        <div class="legend-item"><div class="legend-swatch front-b"></div>Step 2: Hours → SAT (adjust for Prep)</div>
      `;
    }
  }

  // ─── Mode Switching ───
  function setMode(mode) {
    currentMode = mode;

    // Update buttons
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    if (mode === 'observe') document.querySelector('.mode-btn.observe').classList.add('active');
    else if (mode === 'do') document.querySelector('.mode-btn.do-mode').classList.add('active');
    else document.querySelector('.mode-btn.frontdoor').classList.add('active');

    // Update estimate box class
    const estBox = document.getElementById('estimate-box');
    estBox.className = 'estimate-box ' + (mode === 'do' ? 'do-mode' : mode);

    // Update description
    const desc = document.getElementById('description');
    if (mode === 'observe') {
      desc.innerHTML = 'Both causal and confounding paths are active. The estimate captures the effect of prep <em>plus</em> all the ways prep-takers were already going to outscore non-takers.';
    } else if (mode === 'do') {
      desc.innerHTML = 'The arrow from Motivation to Prep is severed. Prep is assigned externally, like a randomized experiment. Only the causal path carries information. <em>The confounding vanishes.</em>';
    } else {
      desc.innerHTML = 'We can\'t run the experiment, but we can estimate through the mediator. Step 1 is already clean. Step 2 is cleaned by adjusting for Prep. <em>Chain them together.</em>';
    }

    // Clear particles
    particles.forEach(p => p.el.remove());
    particles = [];

    // Reset sim and restart
    if (simInterval) { clearInterval(simInterval); simInterval = null; }
    if (loopTimeout) { clearTimeout(loopTimeout); loopTimeout = null; }
    resetSim();
    isRunning = true;
    document.getElementById('pause-icon').style.display = 'block';
    document.getElementById('play-icon').style.display = 'none';

    // Update progress bar color
    const pf = document.getElementById('progress-fill');
    pf.className = 'progress-fill ' + (mode === 'do' ? 'do-mode' : mode);

    simInterval = setInterval(runSimBatch, SIM_SPEED);

    // Update graph
    updateEdges();
  }

  // Expose to onclick handlers
  window.setMode = setMode;

  // ─── Init ───
  updateEdges();
  animateParticles();
  simInterval = setInterval(runSimBatch, SIM_SPEED);

})();
</script>
